<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Survey results</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="survey.css">
<style>
:root{--bar:#2f4bd8;--grid:#e9ebf1}
@media (prefers-color-scheme:dark){:root{--bar:#6f86f7;--grid:#2a2f3e}}
.res main,.res header .in{max-width:900px}.res main{padding-bottom:60px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topline .row button{padding:8px 14px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0 6px}
.filters label{font-size:12px;color:var(--muted);font-weight:600;gap:4px}
select{font:600 15px var(--body);padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.filters .seg{padding:3px}.filters .seg button{padding:7px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .l{font-size:13px;color:var(--muted)} .tile .v{font:600 28px/1.2 var(--body)} .tile .s{font-size:13px;color:var(--muted)}
.sec{margin-top:26px} .sec h2{margin:0 0 4px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.qcard h3{font:700 16px/1.35 var(--body);margin:0} .qcard h3 small{color:var(--muted);font-weight:600;margin-right:6px}
.qcard .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.qcard.empty{padding:10px 16px} .qcard.empty .sub{margin:2px 0 0}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{outline:none;border-radius:6px}
.bars li:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.bars .lab{font-size:14px;line-height:1.3;margin-bottom:3px}
.bars .track{display:flex;align-items:center;gap:8px;min-height:14px}
.bars .bar{height:12px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bars .bar.zero{background:var(--grid);width:2px}
.bars .val{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars li:hover .bar{filter:brightness(1.15)}
.stat{font:600 22px/1.2 var(--body)} .stat small{font:500 14px var(--body);color:var(--muted)}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700} td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td .mini{display:inline-block;height:10px;background:var(--bar);border-radius:0 4px 4px 0;vertical-align:middle;margin-right:6px;min-width:2px}
.texts{margin:0;padding-left:18px} .texts li{margin:6px 0} .texts .d{color:var(--muted);font-size:12px;margin-left:6px}
.others{font-size:13px;color:var(--muted);margin-top:8px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{display:block;font-size:15px}
#tip[hidden]{display:none}
.danger-zone{border-color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font:600 14px var(--body);cursor:pointer;text-decoration:underline}
.flag{display:inline-block;background:var(--bad-soft);color:var(--bad);font:700 11px var(--body);padding:2px 7px;border-radius:999px;margin-left:4px}
.paid{color:var(--ok);font-weight:700;white-space:nowrap}
button.pay{padding:6px 12px;font-size:13px;white-space:nowrap}
#pay_sum{margin-top:0}
</style>
</head>
<body class="sv res">
<header><div class="in"><span class="brand"><i aria-hidden="true">✓</i>Hostel &amp; PG survey</span></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="tip" role="tooltip" hidden></div>
<script src="vendor/supabase.js"></script>
<script src="survey-config.js"></script>
<script src="survey-questions.js"></script>
<script src="survey-results.js"></script>
</body>
</html>
